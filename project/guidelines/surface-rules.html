<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body-sm)}.rg{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}.c{background:var(--surface-card);padding:18px 20px}.k{font:var(--type-mono);letter-spacing:var(--tracking-mono);color:var(--text-faint)}</style>
</head><body><div class="rg" style="grid-template-columns:2fr 1fr 1fr">
<div class="c"><span class="k">2fr</span><div style="font:var(--type-heading-3);color:var(--text-display);margin-top:8px">Featured cell</div></div>
<div class="c"><span class="k">1fr</span><div style="font:var(--type-heading-3);color:var(--text-display);margin-top:8px">Cell</div></div>
<div class="c"><span class="k">1fr</span><div style="font:var(--type-heading-3);color:var(--text-display);margin-top:8px">Cell</div></div>
</div>
<div class="rg" style="grid-template-columns:repeat(4,1fr);margin-top:14px;background:var(--rule-inverse);border-color:var(--rule-inverse)">
<div class="c" style="background:var(--midnight-navy)"><span class="k" style="color:var(--text-inverse-faint)">Área bruta</span><div style="font:var(--type-heading-3);color:var(--text-inverse);margin-top:6px">420 m²</div></div><div class="c" style="background:var(--midnight-navy)"><span class="k" style="color:var(--text-inverse-faint)">Lote</span><div style="font:var(--type-heading-3);color:var(--text-inverse);margin-top:6px">1.100 m²</div></div><div class="c" style="background:var(--midnight-navy)"><span class="k" style="color:var(--text-inverse-faint)">Suítes</span><div style="font:var(--type-heading-3);color:var(--text-inverse);margin-top:6px">4</div></div><div class="c" style="background:var(--midnight-navy)"><span class="k" style="color:var(--text-inverse-faint)">Energia</span><div style="font:var(--type-heading-3);color:var(--text-inverse);margin-top:6px">A+</div></div>
</div>
<p style="margin-top:12px" class="k">--rule rgba(12,25,53,.13) on paper · --rule-inverse rgba(244,241,236,.14) on dark · --rule-strong rgba(12,25,53,.35) for field boxes</p></body></html>

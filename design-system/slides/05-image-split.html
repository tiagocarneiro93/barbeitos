<!-- @dsCard group="Slides" viewport="1280x720" name="Image split" subtitle="Half-bleed photography with a caption column" -->
<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}.slide{width:1280px;height:720px;overflow:hidden;position:relative;background:var(--paper-050);display:flex;flex-direction:column}.pad{padding:88px 96px}.eyebrow{font:var(--weight-medium) 13px/1 var(--font-mono);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase}.foot{position:absolute;left:96px;right:96px;bottom:44px;display:flex;justify-content:space-between;align-items:baseline;font:var(--type-body-sm)}.wm{font:var(--weight-display) 22px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}</style>
</head><body><div class="slide"><div style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)">
<div style="padding:88px 64px 88px 96px;display:flex;flex-direction:column;justify-content:center">
<span class="eyebrow" style="color:var(--text-muted)">Selected work</span>
<h2 style="font:var(--weight-display) 42px/1.12 var(--font-display);color:var(--midnight-navy);margin:22px 0 20px">Quinta do Vale</h2>
<p style="font:var(--weight-regular) 17px/1.62 var(--font-core);color:var(--text-body);margin:0;max-width:38ch">Vinte e quatro residências organizadas em torno de um pátio comum, com acabamentos desenhados e produzidos pelo atelier do grupo.</p>
<dl style="margin:36px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:0 24px">
<div style="padding:12px 0;border-bottom:1px solid var(--border-hairline)"><dt style="font:var(--type-caption);color:var(--text-muted)">Localização</dt><dd style="margin:2px 0 0;font:var(--weight-medium) 16px/1.4 var(--font-core);color:var(--text-strong)">Braga</dd></div><div style="padding:12px 0;border-bottom:1px solid var(--border-hairline)"><dt style="font:var(--type-caption);color:var(--text-muted)">Unidades</dt><dd style="margin:2px 0 0;font:var(--weight-medium) 16px/1.4 var(--font-core);color:var(--text-strong)">24</dd></div><div style="padding:12px 0;border-bottom:1px solid var(--border-hairline)"><dt style="font:var(--type-caption);color:var(--text-muted)">Área bruta</dt><dd style="margin:2px 0 0;font:var(--weight-medium) 16px/1.4 var(--font-core);color:var(--text-strong)">3 480 m²</dd></div><div style="padding:12px 0;border-bottom:1px solid var(--border-hairline)"><dt style="font:var(--type-caption);color:var(--text-muted)">Conclusão</dt><dd style="margin:2px 0 0;font:var(--weight-medium) 16px/1.4 var(--font-core);color:var(--text-strong)">Q4 2026</dd></div>
</dl></div>
<div style="background:var(--surface-muted)"><image-slot id="slide-05" shape="rect" fit="cover" placeholder="Drop project photography" style="width:100%;height:100%"></image-slot></div>
</div>
<script src="../assets/image-slot.js"></script></div></body></html>

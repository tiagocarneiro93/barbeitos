<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:var(--space-6);background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}.row+.row{margin-top:var(--space-4)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.BarbeitosGroupDesignSystem_b431cc;
const { RuleGrid, Card, Dialog, Button, Field, Input, Badge, Meta } = NS;
const media = (h) => <div style={{height:h+'px',background:'var(--paper-100)',display:'flex',alignItems:'flex-end',padding:'10px 12px',font:'var(--type-mono)',letterSpacing:'var(--tracking-mono)',color:'var(--text-faint)'}}>fotografia · placeholder</div>;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return (<div>
    <RuleGrid template="2fr 1fr 1fr">
      <Card interactive media={media(130)} eyebrow="Cascais · Em exclusivo" title="Quinta da Marinha 14" meta="4 suítes · 420 m² · piscina"
        footer={<><span style={{font:'var(--type-heading-3)',color:'var(--text-display)'}}>€3.850.000</span><Meta tone="accent">Detalhe →</Meta></>} />
      <Card interactive media={media(90)} eyebrow="Lisboa · Príncipe Real" title="Palacete Ferreira" meta="3 suítes · 280 m²" />
      <Card tone="navy" eyebrow="Acesso reservado" title="Oportunidades off-market">Seis propriedades não listadas publicamente.</Card>
    </RuleGrid>
    <div className="row" style={{marginTop:'var(--space-5)'}}>
      <Badge tone="exclusive">Exclusivo</Badge>
      <Badge tone="navy">Arrendamento</Badge>
      <Badge tone="outline">+ 24 fotografias · tour 3D</Badge>
      <Button size="sm" onClick={()=>setOpen(true)}>Abrir diálogo</Button>
    </div>
    <Dialog open={open} title="Pedir acesso off-market" description="Partilhamos as seis propriedades não listadas após contacto direto." onClose={()=>setOpen(false)}
      footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancelar</Button><Button onClick={()=>setOpen(false)}>Enviar</Button></>}>
      <Field label="Email" htmlFor="dm"><Input id="dm" placeholder="nome@empresa.com" /></Field>
    </Dialog>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>

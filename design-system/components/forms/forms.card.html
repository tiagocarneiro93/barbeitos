<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{padding:var(--space-6);background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}.row+.row{margin-top:var(--space-4)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.BarbeitosGroupDesignSystem_b431cc;
const { Field, Input, Select, Checkbox, Radio, Switch } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div>
    <div className="grid">
      <Field label="Nome" htmlFor="n"><Input id="n" placeholder="Ana Barbeitos" /></Field>
      <Field label="Localização" htmlFor="d"><Select id="d" placeholder="Selecione" options={['Cascais','Lisboa · Príncipe Real','Comporta','Sintra']} /></Field>
      <Field label="Email" htmlFor="e" error="Introduza um email válido."><Input id="e" invalid defaultValue="ana@" /></Field>
      <Field label="Valor" htmlFor="b" hint="Indicativo, em euros"><Input id="b" placeholder="€1.000.000 – €5.000.000" /></Field>
    </div>
    <div style={{marginTop:'var(--space-5)'}}>
      <Field label="Projeto" htmlFor="p"><Input id="p" multiline rows={3} placeholder="Localização, dimensão e calendário previsto" /></Field>
    </div>
    <div className="row" style={{marginTop:'var(--space-5)',gap:'var(--space-8)'}}>
      <Checkbox label="Autorizo o contacto sobre este pedido" defaultChecked />
      <Radio name="lang" direction="row" defaultValue="PT-PT" options={['PT-PT','EN']} />
      <Switch label="Só em exclusivo" defaultChecked />
    </div>
  </div>
);
</script></body></html>

<!-- @dsCard group="Colors" viewport="700x160" name="Paper scale" subtitle="Warm off-white grounds — #F4F1EC is the page, #E9E6E0 the canvas" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body-sm)}.sw{display:flex;flex-direction:column;gap:0}.sw i{display:block;height:64px}.sw b{font:var(--type-mono);letter-spacing:var(--tracking-mono);color:var(--text-strong);padding-top:8px}.sw s{text-decoration:none;font:var(--type-mono);letter-spacing:var(--tracking-mono);color:var(--text-faint)}.grid{display:grid;gap:12px}.grid{grid-template-columns:repeat(6,1fr)}.sw i{height:52px;border:1px solid var(--rule)}</style>
</head><body><div class="grid">
<div class="sw"><i style="background:var(--paper-000)"></i><b>000</b><s>#FFFFFF</s></div><div class="sw"><i style="background:var(--paper-050)"></i><b>050</b><s>#F4F1EC</s></div><div class="sw"><i style="background:var(--paper-100)"></i><b>100</b><s>#EAE6DF</s></div><div class="sw"><i style="background:var(--paper-200)"></i><b>200</b><s>#E9E6E0</s></div><div class="sw"><i style="background:var(--paper-300)"></i><b>300</b><s>#E2DED6</s></div><div class="sw"><i style="background:var(--paper-400)"></i><b>400</b><s>#C8C2B7</s></div>
</div></body></html>

<!-- @dsCard group="Surfaces" viewport="700x200" name="Elevation & focus" subtitle="Hairline first; long low-opacity navy shadow only for overlays" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-raised);font:var(--type-body-sm)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.box{height:70px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;font:var(--type-caption);color:var(--text-muted)}</style>
</head><body><div style="background:var(--paper-100);padding:20px;margin:-4px"><div class="grid">
<div><div class="box" style="box-shadow:var(--shadow-hairline)">hairline</div></div>
<div><div class="box" style="box-shadow:var(--shadow-raised)">raised</div></div>
<div><div class="box" style="box-shadow:var(--shadow-menu)">menu</div></div>
<div><div class="box" style="box-shadow:var(--shadow-overlay)">overlay</div></div>
</div></div>
<div style="margin-top:14px;display:flex;align-items:center;gap:14px"><button style="height:40px;padding:0 20px;border:1px solid var(--border-strong);background:none;border-radius:var(--radius-control);box-shadow:var(--focus-ring);font:var(--type-body-sm)">Focus ring</button><span style="font:var(--type-caption);color:var(--text-muted)">--focus-ring · 3px foil gold, offset by paper</span></div></body></html>

<!-- @dsCard group="Surfaces" viewport="700x160" name="Radius & borders" subtitle="Zero radius everywhere; 1px rules, 1px field boxes" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body-sm)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.box{height:60px;display:flex;align-items:center;justify-content:center;font:var(--type-mono);letter-spacing:var(--tracking-mono);color:var(--text-faint)}.k{font:var(--type-mono);letter-spacing:var(--tracking-mono);color:var(--text-faint);padding-top:6px}</style>
</head><body><div class="grid">
<div><div class="box" style="border:1px solid var(--rule)">rule</div><div class="k">--rule · card, grid, section</div></div>
<div><div class="box" style="border:1px solid var(--rule-strong)">rule-strong</div><div class="k">--rule-strong · fields, outline button</div></div>
<div><div class="box" style="border:1px dashed var(--rule-strong)">dashed</div><div class="k">upload target only</div></div>
<div><div class="box" style="border:1px solid var(--midnight-navy)">navy</div><div class="k">focused / selected field</div></div>
</div></body></html>

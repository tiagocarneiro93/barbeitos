<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-raised);font:var(--type-body-sm)}.sw{display:flex;flex-direction:column;gap:0}.sw i{display:block;height:64px}.sw b{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-strong);padding-top:8px}.sw s{text-decoration:none;font:var(--type-caption);color:var(--text-muted);font-variant-numeric:tabular-nums}.grid{display:grid;gap:12px}.grid{grid-template-columns:repeat(4,1fr)}.sw i{height:40px}.pair{display:flex;flex-direction:column}</style>
</head><body><div class="grid">
<div class="sw"><i style="background:var(--status-success)"></i><i style="background:var(--status-success-tint)"></i><b>Success</b><s>--status-success</s><s>--status-success-tint</s></div><div class="sw"><i style="background:var(--status-warning)"></i><i style="background:var(--status-warning-tint)"></i><b>Warning</b><s>--status-warning</s><s>--status-warning-tint</s></div><div class="sw"><i style="background:var(--status-danger)"></i><i style="background:var(--status-danger-tint)"></i><b>Danger</b><s>--status-danger</s><s>--status-danger-tint</s></div><div class="sw"><i style="background:var(--status-info)"></i><i style="background:var(--status-info-tint)"></i><b>Info</b><s>--status-info</s><s>--status-info-tint</s></div>
</div></body></html>

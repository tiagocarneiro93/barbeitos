<!-- @dsCard group="Colors" viewport="700x180" name="Accents — terracotta light & foil gold" subtitle="Terracotta-light carries eyebrows on dark; gold is print-only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body-sm)}.sw{display:flex;flex-direction:column;gap:0}.sw i{display:block;height:64px}.sw b{font:var(--type-mono);letter-spacing:var(--tracking-mono);color:var(--text-strong);padding-top:8px}.sw s{text-decoration:none;font:var(--type-mono);letter-spacing:var(--tracking-mono);color:var(--text-faint)}.grid{display:grid;gap:12px}.grid{grid-template-columns:repeat(4,1fr)}</style>
</head><body><div class="grid">
<div class="sw"><i style="background:var(--terracotta-brown)"></i><b>Terracotta</b><s>#4A2B29 · primary action</s></div>
<div class="sw"><i style="background:var(--terracotta-light)"></i><b>Terracotta Light</b><s>#A8724F · eyebrow on dark</s></div>
<div class="sw"><i style="background:var(--foil-gold)"></i><b>Foil Gold</b><s>#C5A059 · print only</s></div>
<div class="sw"><i style="background:var(--text-gold)"></i><b>Gold Text</b><s>#8A6C2F · AA on paper</s></div>
</div>
<p style="margin-top:12px;font:var(--type-mono);letter-spacing:var(--tracking-mono);color:var(--text-faint)">Gold does not appear in the web UI — the approved mock-up carries the accent on terracotta.</p></body></html>

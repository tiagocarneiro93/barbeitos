<!-- @dsCard group="Colors" viewport="700x170" name="Semantic surfaces" subtitle="Page, raised, sunken, inverse, accent" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-raised);font:var(--type-body-sm)}.sw{display:flex;flex-direction:column;gap:0}.sw i{display:block;height:64px}.sw b{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-strong);padding-top:8px}.sw s{text-decoration:none;font:var(--type-caption);color:var(--text-muted);font-variant-numeric:tabular-nums}.grid{display:grid;gap:12px}.grid{grid-template-columns:repeat(6,1fr)}.sw i{height:56px;border:1px solid var(--border-hairline)}</style>
</head><body><div class="grid">
<div class="sw"><i style="background:var(--surface-page)"></i><b>Page</b><s>--surface-page</s></div><div class="sw"><i style="background:var(--surface-raised)"></i><b>Raised</b><s>--surface-raised</s></div><div class="sw"><i style="background:var(--surface-sunken)"></i><b>Sunken</b><s>--surface-sunken</s></div><div class="sw"><i style="background:var(--surface-muted)"></i><b>Muted</b><s>--surface-muted</s></div><div class="sw"><i style="background:var(--surface-inverse)"></i><b>Inverse</b><s>--surface-inverse</s></div><div class="sw"><i style="background:var(--surface-accent)"></i><b>Accent</b><s>--surface-accent</s></div>
</div></body></html>

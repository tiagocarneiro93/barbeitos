<!-- @dsCard group="Website" viewport="1440x900" name="Barbeitos Group — public site" subtitle="Group-led home with the three branches as sections, plus real-estate index, property detail, construction and interiors" -->
<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><title>Barbeitos Group</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/image-slot.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-page)}image-slot{display:block;width:100%;height:100%}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="chrome.view.js"></script>
<script type="text/babel" src="home.view.js"></script>
<script type="text/babel" src="realestate.view.js"></script>
<script type="text/babel" src="property.view.js"></script>
<script type="text/babel" src="construction.view.js"></script>
<script type="text/babel" src="interiors.view.js"></script>
<script type="text/babel" src="contact.view.js"></script>
<script type="text/babel">
function Site() {
  const [route, setRoute] = React.useState('home');
  const [lang, setLang] = React.useState('PT');
  const go = (r) => { setRoute(r); window.scrollTo(0, 0); };
  return (
    <div>
      <Header route={route} onNavigate={go} lang={lang} onLang={setLang} tone={route === 'home' ? 'dark' : 'paper'} />
      <main>
        {route === 'home' && <Home onNavigate={go} />}
        {route === 'realestate' && <RealEstate onNavigate={go} />}
        {route === 'property' && <Property onNavigate={go} />}
        {route === 'construction' && <Construction onNavigate={go} />}
        {route === 'interiors' && <Interiors onNavigate={go} />}
        {route === 'contact' && <Contact />}
      </main>
      <Footer onNavigate={go} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script>
</body></html>

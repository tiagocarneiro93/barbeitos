<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Without this, some Android browsers (Chrome's "Force Dark"/auto dark
     theme for websites, Samsung Internet's dark mode, etc.) auto-invert
     the page for anyone with system dark mode on, since the page never
     says it only supports light. That inversion is what turns a light
     cream section into near-black with white text on some phones while
     looking completely normal in any desktop browser or emulator that
     doesn't have that OS-level feature. -->
<meta name="color-scheme" content="light">
<title id="meta-title">Barbeitos Group — Real Estate, Construção e Interiores</title>
<meta id="meta-description" name="description" content="Barbeitos Group — promoção imobiliária, construção e interiores sob uma identidade, em Braga, Portugal.">
<meta id="meta-robots" name="robots" content="index, follow">
<link id="link-canonical" rel="canonical" href="https://tiagocarneiro93.github.io/barbeitos/">
<link rel="icon" type="image/png" href="design-system/assets/favicon.png">
<link rel="stylesheet" href="design-system/styles.css?v=33">

<!-- Open Graph / social previews. Note: non-JS scrapers (most social-card
     unfurlers, unlike Google/Bing's indexers) only ever see these static
     defaults, since the per-route versions below are applied by JS after
     the route is known — see the Site() effect near the bottom of this
     file. A shared link to e.g. /imobiliario will show this default (home)
     preview, not an Imobiliário-specific one, until the site is prerendered
     per route. -->
<meta id="og-site-name" property="og:site_name" content="Barbeitos Group">
<meta id="og-type" property="og:type" content="website">
<meta id="og-title" property="og:title" content="Barbeitos Group — Real Estate, Construção e Interiores">
<meta id="og-description" property="og:description" content="Barbeitos Group — promoção imobiliária, construção e interiores sob uma identidade, em Braga, Portugal.">
<meta id="og-url" property="og:url" content="https://tiagocarneiro93.github.io/barbeitos/">
<meta id="og-image" property="og:image" content="https://tiagocarneiro93.github.io/barbeitos/design-system/assets/hero-logo.jpg">
<meta id="og-locale" property="og:locale" content="pt_PT">
<meta name="twitter:card" content="summary_large_image">
<meta id="twitter-title" name="twitter:title" content="Barbeitos Group — Real Estate, Construção e Interiores">
<meta id="twitter-description" name="twitter:description" content="Barbeitos Group — promoção imobiliária, construção e interiores sob uma identidade, em Braga, Portugal.">
<meta name="twitter:image" content="https://tiagocarneiro93.github.io/barbeitos/design-system/assets/hero-logo.jpg">

<!-- Organization structured data — static (not route-dependent), so
     every crawler sees it regardless of whether it executes JS. Phone/
     email are the same indicative placeholders flagged elsewhere on the
     site, not real contact details. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Barbeitos Group",
  "url": "https://tiagocarneiro93.github.io/barbeitos/",
  "logo": "https://tiagocarneiro93.github.io/barbeitos/design-system/assets/favicon.png",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Braga",
    "addressCountry": "PT"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+351-21-000-0000",
    "email": "info@barbeitosgroup.pt",
    "contactType": "customer service"
  }
}
</script>

<!-- Populated per-listing by the Site() effect below when route is
     'property' and the slug matches a real listing; cleared (empty)
     otherwise. A separate tag from the Organization one above since this
     one is route-dependent and the other never changes. -->
<script id="listing-jsonld" type="application/ld+json"></script>

<!-- Every local script/stylesheet below carries a ?v=N cache-busting query
     string. Without one, a visitor's browser (or GitHub Pages' own CDN
     cache) can keep serving an old cached copy of these files indefinitely
     after a deploy, since none of them change filename on change — this is
     exactly what happened when a shipped feature didn't appear for a
     returning visitor. Bump N (any change is fine, e.g. the next PR number)
     on ALL of these tags together whenever ANY design-system file listed
     here changes, so every deploy is guaranteed a fresh fetch. The CDN
     react/react-dom/babel scripts don't need this — their URLs are already
     pinned to an exact version. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Portfolio map (realestate.view.js) — no API key needed, tiles from the
     public OpenStreetMap server. If this CDN load fails (ad-blocker, offline),
     PortfolioMapView falls back to the static map image instead of a blank box. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="design-system/assets/image-slot.js?v=33"></script>
<script src="design-system/_ds_bundle.js?v=33"></script>
<script src="design-system/seo/content.js?v=33"></script>
<script src="design-system/i18n/content.js?v=33"></script>
<script src="design-system/data/listings.js?v=33"></script>
<script src="design-system/router.js?v=33"></script>
<style>
body{background:var(--surface-page);margin:0}
image-slot{display:block;width:100%;height:100%}
/* Visually hidden until focused (Tab from a fresh page load lands here
   first) — lets keyboard/screen-reader users jump past the header nav
   straight to the page content instead of tabbing through it every time. */
.skip-link{
  position:absolute;left:8px;top:-48px;z-index:100;
  background:var(--midnight-navy,#0c1935);color:#fff;
  padding:12px 18px;border-radius:0;text-decoration:none;
  font:14px/1 system-ui,-apple-system,sans-serif;
  transition:top .15s ease;
}
.skip-link:focus{top:8px}
/* Portfolio map pins (realestate.view.js) — the brand favicon on a terracotta
   roundel instead of Leaflet's default blue marker images, at the client's
   request. The favicon artwork is white-on-transparent (made for dark
   grounds like the header), so it needs a solid badge behind it to stay
   visible over any map tile. */
.re-map-pin{
  width:32px;height:32px;border-radius:50%;
  background:var(--terracotta-brown,#4a2b29);border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.re-map-pin img{width:24px;height:24px;object-fit:contain;pointer-events:none}
.leaflet-popup-content-wrapper,.leaflet-popup-content{font:var(--type-body-sm,14px/1.5 system-ui,sans-serif);border-radius:0}
.leaflet-popup-content a{color:var(--terracotta-brown,#4a2b29)}
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Saltar para o conteúdo</a>
<script>
  // Can't let the browser handle this href itself: router.js sets a <base>
  // tag pinned to the site root so relative asset paths survive pushState
  // navigation (see router.js), but that also means a bare "#main-content"
  // resolves against THAT base, not the current pushState'd route — e.g. on
  // /imobiliario/villa-marinha-14 it resolves to /#main-content, a
  // different document, so the browser does a full reload back to the
  // home page instead of jumping within the current page. Handling the
  // click ourselves (preventDefault, then scroll + focus manually) avoids
  // the browser's own href resolution entirely.
  document.querySelector('.skip-link').addEventListener('click', function (e) {
    e.preventDefault();
    var target = document.getElementById('main-content');
    if (target) { target.scrollIntoView(); target.focus(); }
  });
</script>
<div id="root"></div>
<script type="text/babel" src="design-system/ui_kits/website/chrome.view.js?v=33"></script>
<script type="text/babel" src="design-system/ui_kits/website/home.view.js?v=33"></script>
<script type="text/babel" src="design-system/ui_kits/website/realestate.view.js?v=33"></script>
<script type="text/babel" src="design-system/ui_kits/website/property.view.js?v=33"></script>
<script type="text/babel" src="design-system/ui_kits/website/construction.view.js?v=33"></script>
<script type="text/babel" src="design-system/ui_kits/website/interiors.view.js?v=33"></script>
<script type="text/babel" src="design-system/ui_kits/website/contact.view.js?v=33"></script>
<script type="text/babel">
function Site() {
  const initial = React.useMemo(() => Router.parse(), []);
  const [route, setRoute] = React.useState(initial.route);
  const [lang, setLang] = React.useState(initial.lang);
  const [routeParams, setRouteParams] = React.useState(initial.params);

  React.useEffect(() => {
    const onPop = () => {
      const next = Router.parse();
      setRoute(next.route);
      setLang(next.lang);
      setRouteParams(next.params);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  React.useEffect(() => {
    const localeKey = { PT: 'pt-PT', EN: 'en', ES: 'es', FR: 'fr' }[lang] || 'pt-PT';
    document.documentElement.lang = localeKey;

    const locale = SEO_CONTENT.locales[localeKey] || SEO_CONTENT.locales['pt-PT'];
    const url = SEO_CONTENT.productionOrigin + Router.buildPath(route, lang, routeParams);
    const defaultImage = SEO_CONTENT.productionOrigin + '/barbeitos/design-system/assets/hero-logo.jpg';
    const setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
    const setAttr = (id, attr, value) => { const el = document.getElementById(id); if (el) el.setAttribute(attr, value); };

    // The 'property' route covers every listing under one generic
    // locale.routes.property entry — before this, EVERY listing shared
    // Villa Marinha 14's title/description/image, since that entry was
    // written before property pages became slug-based. Build a real
    // per-listing entry here instead, with its own JSON-LD, and a
    // distinct noindex entry for an unmatched slug (the NotFound page)
    // so it's never presented to search engines as if it were real
    // content.
    let entry = locale.routes[route] || locale.routes.home;
    let image = defaultImage;
    let robots = 'index, follow';
    let jsonLd = null;
    if (route === 'property') {
      const listing = (window.LISTINGS || []).find((l) => l.slug === routeParams.slug);
      if (listing) {
        entry = { title: listing.name + ' — Barbeitos Group', description: listing.description };
        if (listing.gallery && listing.gallery[0] && listing.gallery[0].src) {
          image = SEO_CONTENT.productionOrigin + '/barbeitos/' + listing.gallery[0].src;
        }
        jsonLd = {
          '@context': 'https://schema.org',
          '@type': 'RealEstateListing',
          name: listing.name,
          description: listing.description,
          url: url,
          image: image,
          offers: { '@type': 'Offer', priceCurrency: 'EUR', price: listing.priceValue, availability: 'https://schema.org/InStock' },
        };
      } else {
        entry = { title: 'Anúncio não encontrado — Barbeitos Group', description: 'Este imóvel já não está disponível ou a ligação está incorreta.' };
        robots = 'noindex, follow';
      }
    }

    setText('meta-title', entry.title);
    setAttr('meta-description', 'content', entry.description);
    setAttr('meta-robots', 'content', robots);
    setAttr('link-canonical', 'href', url);
    setAttr('og-title', 'content', entry.title);
    setAttr('og-description', 'content', entry.description);
    setAttr('og-url', 'content', url);
    setAttr('og-image', 'content', image);
    setAttr('og-locale', 'content', locale.ogLocale);
    setAttr('twitter-title', 'content', entry.title);
    setAttr('twitter-description', 'content', entry.description);
    const twitterImg = document.querySelector('meta[name="twitter:image"]');
    if (twitterImg) twitterImg.setAttribute('content', image);
    const jsonLdEl = document.getElementById('listing-jsonld');
    if (jsonLdEl) jsonLdEl.textContent = jsonLd ? JSON.stringify(jsonLd) : '';
  }, [route, lang, routeParams]);

  const go = (r, params) => { setRoute(r); setRouteParams(params || {}); Router.navigate(r, lang, params); window.scrollTo(0, 0); };
  const changeLang = (l) => { setLang(l); Router.navigate(route, l, routeParams); };
  return (
    <div>
      <Header route={route} onNavigate={go} lang={lang} onLang={changeLang} tone={route === 'home' ? 'dark' : 'paper'} />
      <main id="main-content" tabIndex={-1} style={{ outline: 'none' }}>
        {route === 'home' && <Home onNavigate={go} />}
        {route === 'realestate' && <RealEstate onNavigate={go} />}
        {route === 'property' && <Property key={routeParams.slug} onNavigate={go} slug={routeParams.slug} />}
        {route === 'construction' && <Construction onNavigate={go} />}
        {route === 'interiors' && <Interiors onNavigate={go} />}
        {route === 'contact' && <Contact />}
      </main>
      <Footer onNavigate={go} lang={lang} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script>
</body>
</html>
